name: DDPAIDashcam
options:
  bundleIdPrefix: com.gsumit1.ddpaidashcam
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  DDPAIDashcam:
    # The feature code lives in the local Swift package at the repo root.
    path: .

schemes:
  DDPAIDashcamApp:
    build:
      targets:
        DDPAIDashcamApp: all
    run:
      config: Debug

targets:
  DDPAIDashcamApp:
    type: application
    platform: iOS
    productName: DDPAIDashcamApp
    deploymentTarget: "16.0"
    sources:
      - path: App
    dependencies:
      # Link the local Swift package's library product into the app target.
      - package: DDPAIDashcam
        product: DDPAIDashcam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsumit1.ddpaidashcam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The camera is reached over its own Wi-Fi hotspot (local networking).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Used to discover and connect to your DDPAI dash camera over its Wi-Fi hotspot."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Used to save downloaded dash cam clips to your photo library."
